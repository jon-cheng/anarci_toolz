name: tests

on:
  push:
  pull_request:

jobs:
  tier1-unit-tests:
    name: Tier 1 (pure-logic unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.10
      - run: uv sync --extra dev --python 3.10
      - run: uv run pytest -m "not bio" -q

  tier2-bio-tests:
    name: Tier 2 (real ANARCI/AbNumber, via Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t anarci-toolz-test .
      - name: Run bio-dependent tests
        run: docker run --rm --entrypoint pytest anarci-toolz-test -m bio -q
